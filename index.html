<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Workout Timer</title>
</head>
<body>
  <main>
    <section id="config">
      <h1>Workout Timer</h1>
      <label>Exercise time (s) <input id="exerciseTime" type="number" min="1" value="30" inputmode="numeric"></label>
      <label>Rest time (s) <input id="restTime" type="number" min="0" value="10" inputmode="numeric"></label>
      <label>Number of exercises <input id="exercises" type="number" min="1" value="4" inputmode="numeric"></label>
      <label>Number of sets <input id="sets" type="number" min="1" value="3" inputmode="numeric"></label>
      <button id="start" class="primary">Start Workout</button>
    </section>
    <section id="workout" hidden>
      <div id="phase">Exercise</div>
      <div id="countdown">00:00</div>
      <div id="progressText">Exercise 1 / 4 · Set 1 of 3</div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="total">Total remaining: 00:00</div>
      <div class="row">
        <button id="toggle" class="primary">Pause</button>
        <button id="reset">Reset</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
